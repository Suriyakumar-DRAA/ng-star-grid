<div class="pagination-container" *ngIf="paginationData">
    <div class="pagination-info">
        <div class="records-info">
            Showing {{getStartRecord()}} to {{getEndRecord()}} of {{paginationData.totalCount}} records
        </div>

        <div class="page-size-selector">
            <label for="pageSize">Show:</label>
            <select id="pageSize" [value]="paginationData.pageSize" (change)="onPageSizeChange($event)"
                class="page-size-select">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <span>per page</span>
        </div>
    </div>

    <div class="pagination-controls">
        <button class="pagination-btn" [disabled]="!paginationData.hasPreviousPage" (click)="goToPage(1)"
            title="First page">
            ⟪
        </button>

        <button class="pagination-btn" [disabled]="!paginationData.hasPreviousPage"
            (click)="goToPage(paginationData.currentPage - 1)" title="Previous page">
            ⟨
        </button>

        <div class="page-numbers">
            <button *ngFor="let page of getVisiblePages()" class="page-btn"
                [class.active]="page === paginationData.currentPage" [class.ellipsis]="page === '...'"
                [disabled]="page === '...'" (click)="page !== '...' && goToPage(page)">
                {{page}}
            </button>
        </div>

        <button class="pagination-btn" [disabled]="!paginationData.hasNextPage"
            (click)="goToPage(paginationData.currentPage + 1)" title="Next page">
            ⟩
        </button>

        <button class="pagination-btn" [disabled]="!paginationData.hasNextPage"
            (click)="goToPage(paginationData.totalPages)" title="Last page">
            ⟫
        </button>
    </div>

    <div class="page-jump">
        <label for="pageJump">Go to page:</label>
        <input id="pageJump" type="number" [min]="1" [max]="paginationData.totalPages" [(ngModel)]="jumpToPage"
            (keyup.enter)="goToPage(jumpToPage)" class="page-jump-input">
        <button class="go-btn" [disabled]="!isValidPage(jumpToPage)" (click)="goToPage(jumpToPage)">
            Go
        </button>
    </div>
</div>
